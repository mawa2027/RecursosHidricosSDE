server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aplicación de una sola página: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos generados por Vite llevan un código en el nombre: se pueden guardar en caché
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
